name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN cannot push a tag whose commit changes a workflow file.
          # Add a deploy key as the DOCUMENTER_KEY secret to tag those commits too.
          # See: https://github.com/JuliaRegistries/TagBot#commits-that-modify-workflow-files
          ssh: ${{ secrets.DOCUMENTER_KEY }}
